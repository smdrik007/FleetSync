name: FleetSync CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-ci:
    name: Backend Checks & Schema Validation
    runs-on: ubuntu-latest

    # Prisma validate/generate don't connect to the DB — dummy URLs satisfy
    # the env var requirement without exposing real credentials.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_dummy?sslmode=disable
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Prisma Schema
        run: |
          cd backend
          npx prisma validate

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Syntax check backend source files
        run: |
          cd backend
          node --check src/index.js
          node --check src/db/client.js
          node --check src/db/seed.js
          node --check src/middleware/auth.js
          node --check src/middleware/error.js
          node --check src/routes/auth.js
          node --check src/routes/driver.js
          node --check src/routes/fleet.js
          node --check src/routes/passenger.js
          node --check src/ws/server.js

      - name: Verify static web assets
        run: |
          node --check website/app.js
          test -f website/index.html
          test -f website/authority/index.html
          test -f website/driver/index.html
          test -f website/passenger/index.html
          test -f website/style.css
