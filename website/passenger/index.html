<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetSync | Track My Bus</title>
  <meta name="description" content="Track your bus in real time with a live map, route milestones and driver contact." />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../app.js"></script>
</head>
<body class="m-app">

<header class="m-top">
  <div class="logo-mark" aria-hidden="true">FS</div>
  <div class="m-title">Track my bus<small id="rider-name">&nbsp;</small></div>
  <div class="m-actions">
    <div class="ws-pill" role="status" aria-live="polite"><i class="dot-live off" id="ws-dot"></i><span id="ws-text">Connecting</span></div>
    <button class="top-btn" id="theme-btn" type="button" aria-label="Toggle theme"></button>
    <button class="top-btn" id="logout-btn" type="button" aria-label="Sign out"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></button>
  </div>
</header>

<main class="m-content">

  <div class="form-group" style="margin:0">
    <label class="form-label" for="vehicle-select">Choose a vehicle</label>
    <select class="form-select" id="vehicle-select"><option value="">Loading vehicles…</option></select>
  </div>

  <div id="signal-lost-banner" class="alert alert-warning hidden" role="status" aria-live="polite" style="margin:0">
    <span class="alert-icon" aria-hidden="true">!</span><span id="signal-lost-text">Signal lost</span>
  </div>

  <div class="m-map" id="map-wrap">
    <div id="map" style="height:100%;width:100%"></div>
    <div class="m-map-badge" id="map-live-badge"></div>
  </div>

  <div id="vehicle-card" class="m-card hidden">
    <div class="m-row">
      <div>
        <div class="m-label">Vehicle</div>
        <div class="m-vehicle" id="v-number" style="font-size:1.5rem">—</div>
        <div class="m-sub" id="v-plate"></div>
      </div>
      <div id="v-status"></div>
    </div>
    <div id="not-started" class="alert alert-info hidden" style="margin:14px 0 0">
      <span class="alert-icon" aria-hidden="true">i</span><span>This trip has not started yet. The map updates as soon as the driver begins.</span>
    </div>
    <div id="next-stop" class="hidden" style="margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-bg);border:1px solid var(--border)" role="status" aria-live="polite">
      <div class="m-label" id="ns-label">Next stop</div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="font-size:1.15rem;font-weight:800" id="ns-name">—</div>
        <div style="text-align:right"><div style="font-size:1.15rem;font-weight:800" id="ns-eta">—</div><div class="text-xs text-muted" id="ns-sub"></div></div>
      </div>
    </div>
    <div id="stepper-wrap" class="hidden" style="margin-top:16px">
      <div class="m-label">Route milestones</div>
      <div id="route-name" class="text-sm" style="margin-bottom:8px;color:var(--text-2)"></div>
      <div id="route-stepper"></div>
    </div>
  </div>

  <div id="driver-card" class="m-card m-contact hidden">
    <div class="driver-avatar" id="driver-avatar">?</div>
    <div class="grow">
      <div style="font-size:.92rem;font-weight:700" id="driver-name">—</div>
      <div class="text-xs text-muted" id="driver-meta">—</div>
    </div>
    <a id="call-btn" href="#" class="btn btn-success btn-sm">Call</a>
  </div>

  <div id="pick-hint" class="m-card m-hero">
    <div class="empty-state-title">Pick a vehicle to follow</div>
    <div class="empty-state-sub" style="margin:6px auto 0">Choose a bus above to see where it is right now, its route and who is driving.</div>
  </div>

</main>

<div id="toast-container"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Passenger portal — live map, route milestones, driver contact
   Status values follow the schema (lowercase). Stops come from route_stops.
   ═══════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const STALE_MS = 30000;          // matches the server's LOCATION_STALE_MS default
const SUN = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const MOON = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

let map, marker, routeLayer;
let selectedId = null, lastUpdateAt = null, staleTimer = null, current = null; // current = last status snapshot
let vehicles = [];

(async function init() {
  if (!Auth.require('PASSENGER')) return;
  $('rider-name').textContent = Auth.user()?.name || '';
  const paintTheme = () => { $('theme-btn').innerHTML = Theme.current() === 'light' ? MOON : SUN; };
  $('theme-btn').addEventListener('click', () => { Theme.toggle(); paintTheme(); }); paintTheme();
  $('logout-btn').onclick = signOut;

  initMap();

  WsManager.connect();
  const paintWs = (s) => { const on = s === 'connected'; $('ws-dot').className = `dot-live ${on ? '' : 'warn'}`; $('ws-text').textContent = on ? 'Live' : 'Reconnecting'; };
  WsManager.on('status', paintWs); paintWs(WsManager.status);
  WsManager.on('location.update', onLocationUpdate);
  WsManager.on('vehicle.status_changed', onStatusChanged);
  WsManager.on('vehicle.route_updated', () => selectedId && loadStatus(selectedId, { quiet: true }));
  WsManager.on('vehicle.driver_assigned', (d) => { if (d.vehicleId === selectedId) loadStatus(selectedId, { quiet: true }); });
  WsManager.on('trip.started', (d) => { if (d.vehicleId === selectedId) { Toast.info(`${d.vehicleNumber} has started its trip.`); loadStatus(selectedId, { quiet: true }); } });
  WsManager.on('trip.ended', onTripEnded);

  $('vehicle-select').onchange = async function () {
    if (selectedId) WsManager.unwatchVehicle(selectedId);
    selectedId = this.value || null;
    resetView();
    if (selectedId) { WsManager.watchVehicle(selectedId); await loadStatus(selectedId); }
  };

  await loadVehicles();
})();

/* ─── Map ──────────────────────────────────────────────────────────── */
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([23.685, 90.356], 7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
  routeLayer = L.layerGroup().addTo(map);
}

function busIcon(stale) {
  return L.divIcon({ className: '', html: `<div class="fs-marker ${stale ? 'stale' : 'live'}"><svg class="icon icon-sm" viewBox="0 0 24 24" style="stroke:#04261a"><path d="M8 6v6M15 6v6M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><circle cx="16" cy="18" r="2"/></svg></div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
}

function setMarker(lat, lng, stale, follow = true) {
  if (marker) { marker.setLatLng([lat, lng]); marker.setIcon(busIcon(stale)); }
  else marker = L.marker([lat, lng], { icon: busIcon(stale) }).addTo(map);
  if (follow) map.setView([lat, lng], Math.max(map.getZoom(), 14));
}

function drawRoute(stops) {
  routeLayer.clearLayers();
  if (!stops?.length) return;
  const pts = stops.map((s) => [s.latitude, s.longitude]);
  L.polyline(pts, { color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), weight: 4, opacity: 0.55, dashArray: '2 8' }).addTo(routeLayer);
  stops.forEach((s, i) => L.circleMarker([s.latitude, s.longitude], { radius: 6, color: '#fff', weight: 2, fillColor: '#2ee6c5', fillOpacity: 1 }).bindTooltip(Object.assign(document.createElement('span'), { textContent: `${i + 1}. ${s.name}` })).addTo(routeLayer));
}

/* ─── Vehicle list (FR-PAS-01) ─────────────────────────────────────── */
async function loadVehicles() {
  try {
    vehicles = await Api.get('/passenger/vehicles');
    const sel = $('vehicle-select');
    sel.replaceChildren(new Option('Select a vehicle', ''));
    if (!vehicles.length) { sel.replaceChildren(new Option('No vehicles available yet', '')); return; }
    vehicles.forEach((v) => {
      const dot = v.currentStatus === 'on_trip' ? '● ' : v.currentStatus === 'idle' ? '○ ' : '× ';
      const opt = new Option(`${dot}${v.vehicleNumber}, ${v.assignedRoute || 'No route set'}`, v.id);
      opt.disabled = !v.selectable;
      sel.append(opt);
    });
  } catch (err) { Toast.error('Could not load vehicles: ' + err.message); }
}

/* ─── Vehicle status (FR-PAS-02, FR-PAS-04) ────────────────────────── */
async function loadStatus(id, { quiet = false } = {}) {
  try {
    const data = await Api.get(`/passenger/vehicles/${id}/status`);
    if (id !== selectedId) return;
    render(data);
  } catch (err) { if (!quiet) Toast.error('Could not load the vehicle: ' + err.message); }
}

function haversine(a, b) {
  const R = 6371000, rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/** Index of the stop nearest to the bus (the "current" milestone); -1 before the trip starts. */
function milestoneIndex(stops, pos, onTrip) {
  if (!onTrip || !stops.length || !pos || pos.latitude == null) return onTrip && stops.length ? 0 : -1;
  let best = 0, bestD = Infinity;
  stops.forEach((s, i) => { const d = haversine([s.latitude, s.longitude], [pos.latitude, pos.longitude]); if (d < bestD) { bestD = d; best = i; } });
  return best;
}

function render(data) {
  current = data;
  $('pick-hint').classList.add('hidden');
  $('vehicle-card').classList.remove('hidden');
  $('v-number').textContent = data.vehicleNumber;
  $('v-plate').textContent = data.plateNumber;
  $('v-status').innerHTML = statusBadge(data.currentStatus);

  const onTrip = data.activeTrip?.status === 'in_progress';
  const pos = data.lastKnownPosition;

  if (pos && pos.latitude != null) {
    setMarker(pos.latitude, pos.longitude, pos.isStale);
    lastUpdateAt = new Date(pos.updatedAt).getTime();
    setSignal(pos.isStale, pos.updatedAt);
  } else { $('map-live-badge').replaceChildren(); setSignal(false, null); }

  $('not-started').classList.toggle('hidden', onTrip || data.currentStatus !== 'idle');
  renderProgress(data.progress, pos);

  const stops = data.routeStops?.length ? data.routeStops : parseRoute(data.assignedRoute).map((name) => ({ name }));
  drawRoute(data.routeStops);
  if (stops.length) {
    $('route-name').textContent = data.assignedRoute || '';
    renderStepper($('route-stepper'), stops.map((s) => s.name), milestoneIndex(data.routeStops || [], pos, onTrip));
    $('stepper-wrap').classList.remove('hidden');
  } else $('stepper-wrap').classList.add('hidden');

  if (data.assignedDriver) renderDriver(data.assignedDriver, data.vehicleNumber);
  else $('driver-card').classList.add('hidden');

  startStaleMonitor();
}

/** Next stop and approximate arrival, from the server (it knows the route and the bus's recent speed). */
function renderProgress(p, pos) {
  const card = $('next-stop');
  if (!p || (pos && pos.isStale)) { card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  if (!p.next) {
    $('ns-label').textContent = 'Trip status';
    $('ns-name').textContent = `Arrived at ${p.atStop}`;
    $('ns-eta').textContent = 'Final stop';
    $('ns-sub').textContent = '';
    return;
  }
  $('ns-label').textContent = p.atStop ? `At ${p.atStop} · next stop` : 'Next stop';
  $('ns-name').textContent = p.next.name;
  $('ns-eta').textContent = p.next.etaMinutes <= 1 ? 'about 1 min' : `about ${p.next.etaMinutes} min`;
  const km = p.next.distanceM >= 1000 ? `${(p.next.distanceM / 1000).toFixed(1)} km` : `${Math.round(p.next.distanceM / 10) * 10} m`;
  $('ns-sub').textContent = `${km} away · estimate`;
}

function renderDriver(driver, vehicleNumber) {
  $('driver-avatar').textContent = driver.name.split(' ').map((w) => w[0]).join('').toUpperCase().slice(0, 2);
  $('driver-name').textContent = driver.name;
  $('driver-meta').textContent = `${driver.phone || 'No phone on file'} · ${vehicleNumber}`;
  const call = $('call-btn');
  call.href = driver.phone ? `tel:${driver.phone}` : '#';
  call.classList.toggle('hidden', !driver.phone);
  $('driver-card').classList.remove('hidden');
}

/* ─── Signal fallback (FR-PAS-04) ──────────────────────────────────── */
function setSignal(stale, updatedAt) {
  const banner = $('signal-lost-banner');
  const badge = document.createElement('span');
  if (stale) {
    $('signal-lost-text').textContent = `Signal lost. Last updated ${timeAgo(new Date(updatedAt))}`;
    badge.className = 'badge badge-amber'; badge.textContent = `Last seen ${fmtTime(updatedAt)}`;
    if (marker) setMarker(marker.getLatLng().lat, marker.getLatLng().lng, true, false);
  } else if (updatedAt !== null || lastUpdateAt) {
    badge.className = 'badge badge-green badge-dot'; badge.textContent = 'Live';
  }
  banner.classList.toggle('hidden', !stale);
  $('map-live-badge').replaceChildren(...(badge.textContent ? [badge] : []));
}

function startStaleMonitor() {
  clearInterval(staleTimer);
  staleTimer = setInterval(() => {
    if (lastUpdateAt && Date.now() - lastUpdateAt > STALE_MS) setSignal(true, new Date(lastUpdateAt).toISOString());
  }, 5000);
}

/* ─── Live events ──────────────────────────────────────────────────── */
let lastProgressAt = 0;
function onLocationUpdate(d) {
  if (d.vehicleId !== selectedId) return;
  lastUpdateAt = Date.now();
  // The next stop and time are worked out on the server; ask again every 15 s while the bus moves.
  if (Date.now() - lastProgressAt > 15000) { lastProgressAt = Date.now(); loadStatus(selectedId, { quiet: true }); }
  setMarker(d.latitude, d.longitude, false);
  setSignal(false, null);
  $('map-live-badge').replaceChildren(Object.assign(document.createElement('span'), { className: 'badge badge-green badge-dot', textContent: 'Live' }));
  if (current?.routeStops?.length) renderStepper($('route-stepper'), current.routeStops.map((s) => s.name), milestoneIndex(current.routeStops, { latitude: d.latitude, longitude: d.longitude }, true));
}

function onStatusChanged(d) {
  if (d.vehicleId !== selectedId) return;
  $('v-status').innerHTML = statusBadge(d.currentStatus);
  if (d.currentStatus === 'on_trip') $('not-started').classList.add('hidden');
}

function onTripEnded(d) {
  if (d.vehicleId !== selectedId) return;
  Toast.info(`Trip has ended for ${d.vehicleNumber}.`);
  clearInterval(staleTimer); staleTimer = null; lastUpdateAt = null;
  $('signal-lost-banner').classList.add('hidden');
  $('next-stop').classList.add('hidden');
  $('map-live-badge').replaceChildren(Object.assign(document.createElement('span'), { className: 'badge badge-muted', textContent: 'Trip ended' }));
  $('v-status').innerHTML = statusBadge('idle');
}

/* ─── Helpers ──────────────────────────────────────────────────────── */
function resetView() {
  if (marker) { marker.remove(); marker = null; }
  routeLayer.clearLayers();
  clearInterval(staleTimer); staleTimer = null; lastUpdateAt = null; current = null;
  ['signal-lost-banner', 'vehicle-card', 'driver-card', 'not-started', 'next-stop'].forEach((id) => $(id).classList.add('hidden'));
  $('pick-hint').classList.toggle('hidden', !!selectedId);
  $('map-live-badge').replaceChildren();
  map.setView([23.685, 90.356], 7);
}

function timeAgo(date) {
  const secs = Math.floor((Date.now() - date) / 1000);
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.floor(secs / 60);
  return `${mins} minute${mins !== 1 ? 's' : ''} ago`;
}

function signOut() { clearInterval(staleTimer); Auth.clear(); window.location.href = '../index.html'; }
</script>
</body>
</html>
