<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetSync | Driver Console</title>
  <meta name="description" content="FleetSync driver console: view your assignment, start and end trips, and share your live location." />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../style.css" />
  <script src="../app.js"></script>
</head>
<body class="m-app">

<header class="m-top">
  <div class="logo-mark" aria-hidden="true">FS</div>
  <div class="m-title">Driver Console<small id="driver-name">&nbsp;</small></div>
  <div class="m-actions">
    <div class="ws-pill" role="status" aria-live="polite"><i class="dot-live off" id="ws-dot"></i><span id="ws-text">Connecting</span></div>
    <button class="top-btn" id="theme-btn" type="button" aria-label="Toggle theme"></button>
    <div style="position:relative">
      <button class="top-btn" id="bell-btn" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="bell-badge hidden" id="bell-badge">0</span>
      </button>
      <div class="menu hidden" id="bell-menu" role="menu"></div>
    </div>
    <button class="top-btn" id="logout-btn" type="button" aria-label="Sign out"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></button>
  </div>
</header>

<main class="m-content" id="main">

  <div id="live-banner" class="alert alert-live hidden" role="status" aria-live="polite" style="margin:0">
    <span class="pulse-dot"></span><span>Live location sharing is ON</span>
  </div>

  <div id="reassign-alert" class="alert alert-purple hidden" role="alert" style="margin:0">
    <span class="alert-icon" aria-hidden="true">!</span>
    <div><strong>Assignment updated</strong>
      <div id="reassign-msg" style="font-size:.8rem;margin-top:2px;"></div>
      <button class="btn btn-outline btn-sm mt-2" id="dismiss-reassign" type="button">Dismiss</button></div>
  </div>

  <section id="assignment-card" class="m-card hidden" aria-label="Your assignment">
    <div class="m-row">
      <div>
        <div class="m-label">Your vehicle</div>
        <div class="m-vehicle" id="vehicle-number">—</div>
        <div class="m-sub" id="vehicle-plate">—</div>
      </div>
      <div id="vehicle-status-badge"></div>
    </div>

    <div class="m-stats" id="trip-stats">
      <div class="m-stat"><strong id="stat-elapsed">—</strong><span>Elapsed</span></div>
      <div class="m-stat"><strong id="stat-stops">—</strong><span>Stops</span></div>
      <div class="m-stat"><strong id="stat-speed">—</strong><span>Speed</span></div>
    </div>

    <div class="m-label">Route</div>
    <div id="route-name" class="text-sm" style="margin-bottom:8px;color:var(--text-2)"></div>
    <div id="route-stepper" style="margin-bottom:16px;min-height:28px;"></div>

    <div id="gps-coords-wrap" class="hidden"><div class="gps-coords" id="gps-coords">Waiting for GPS…</div></div>

    <button id="start-trip-btn" class="trip-btn trip-btn-start hidden" type="button">
      <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg> Start trip
    </button>
    <button id="end-trip-btn" class="trip-btn trip-btn-end hidden" type="button">
      <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg> End trip
    </button>
    <div id="trip-hint" class="text-xs text-muted text-center" style="margin-top:4px;"></div>
  </section>

  <section id="no-assignment" class="m-card m-hero hidden">
    <div class="empty-state-icon" aria-hidden="true">
      <svg class="icon icon-lg" viewBox="0 0 24 24" style="width:44px;height:44px"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>
    </div>
    <div class="empty-state-title" style="margin-top:12px">No vehicle assigned</div>
    <div class="empty-state-sub" style="margin:6px auto 0">The transport authority has not assigned you a vehicle yet. This page updates as soon as they do.</div>
  </section>

  <section id="loading-state" class="m-hero"><div class="spinner" style="width:30px;height:30px;border-width:3px;margin:0 auto"></div></section>

</main>

<div id="toast-container"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Driver Console — assignment, trip controls, live GPS, notifications
   Status values follow the schema (lowercase): idle | on_trip | …, trips: in_progress | completed
   ═══════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const state = { vehicle: null, trip: null, driverId: null, watchId: null, tickTimer: null, notes: [], speed: null };

const BELL_SVG = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const SUN = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const MOON = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

(async function init() {
  if (!Auth.require('DRIVER')) return;
  $('driver-name').textContent = Auth.user()?.name || '';

  const paintTheme = () => { $('theme-btn').innerHTML = Theme.current() === 'light' ? MOON : SUN; };
  $('theme-btn').addEventListener('click', () => { Theme.toggle(); paintTheme(); }); paintTheme();

  $('logout-btn').onclick = signOut;
  $('start-trip-btn').onclick = startTrip;
  $('end-trip-btn').onclick = endTrip;
  $('dismiss-reassign').onclick = () => $('reassign-alert').classList.add('hidden');
  setupBell();

  WsManager.connect();
  const paintWs = (s) => { const on = s === 'connected'; $('ws-dot').className = `dot-live ${on ? '' : 'warn'}`; $('ws-text').textContent = on ? 'Live' : 'Reconnecting'; };
  WsManager.on('status', paintWs); paintWs(WsManager.status);

  // Reassignment (FR-DRV-04): events carry the DRIVER record id, which the assignment call returns.
  WsManager.on('vehicle.driver_assigned', (data) => {
    if (!state.driverId) return;
    if (data.newDriver?.id === state.driverId || data.previousDriverId === state.driverId) {
      showReassign(data);
      loadAssignment();
    }
  });
  WsManager.on('vehicle.route_updated', (d) => { if (state.vehicle && d.vehicleId === state.vehicle.id) { Toast.info('Route updated by the transport authority.'); loadAssignment({ quiet: true }); } });
  WsManager.on('notification.new', (n) => { Toast.info(n.title); loadNotifications(); });

  await loadAssignment();
  loadNotifications();
})();

/* ─── Assignment ───────────────────────────────────────────────────── */
async function loadAssignment({ quiet = false } = {}) {
  if (!quiet) showState('loading');
  try {
    const data = await Api.get('/driver/me/assignment');
    state.vehicle = data.vehicle; state.trip = data.activeTrip; state.driverId = data.driverId;
    if (!data.assigned) { stopGps(); showState('no-assignment'); return; }
    renderAssignment();
    showState('assignment');
    if (state.trip && state.watchId === null) startGps();   // resume sharing after a page reload mid-trip
  } catch (err) {
    Toast.error('Could not load your assignment: ' + err.message);
    showState('no-assignment');
  }
}

const onTrip = () => state.trip?.status === 'in_progress';

function routeStops() {
  const v = state.vehicle;
  return v.routeStops?.length ? v.routeStops.map((s) => s.name) : parseRoute(v.assignedRoute);
}

function renderAssignment() {
  const v = state.vehicle;
  $('vehicle-number').textContent = v.vehicleNumber;
  $('vehicle-plate').textContent = `${v.plateNumber}${v.model ? ` · ${v.model}` : ''}${v.capacity ? ` · ${v.capacity} seats` : ''}`;
  $('vehicle-status-badge').innerHTML = statusBadge(v.currentStatus);
  $('route-name').textContent = v.assignedRoute || 'No route assigned. You are on demand.';

  const stops = routeStops();
  renderStepper($('route-stepper'), stops, -1);
  $('stat-stops').textContent = stops.length || '—';

  const active = onTrip();
  $('assignment-card').classList.toggle('live', active);
  $('start-trip-btn').classList.toggle('hidden', active);
  $('end-trip-btn').classList.toggle('hidden', !active);
  $('live-banner').classList.toggle('hidden', !active);
  $('gps-coords-wrap').classList.toggle('hidden', !active);
  $('trip-hint').textContent = active ? 'Location sharing stops the moment you end the trip.' : 'Location sharing starts when you start the trip.';
  tickElapsed();
  clearInterval(state.tickTimer);
  if (active) state.tickTimer = setInterval(tickElapsed, 1000);
}

function tickElapsed() {
  if (!onTrip()) { $('stat-elapsed').textContent = '—'; $('stat-speed').textContent = '—'; return; }
  const s = Math.max(0, Math.floor((Date.now() - new Date(state.trip.startedAt).getTime()) / 1000));
  const hh = Math.floor(s / 3600), mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
  $('stat-elapsed').textContent = hh ? `${hh}:${mm}:${ss}` : `${mm}:${ss}`;
  $('stat-speed').textContent = state.speed != null ? `${Math.round(state.speed * 3.6)} km/h` : '—';
}

/* ─── Trip controls ────────────────────────────────────────────────── */
async function startTrip() {
  const btn = $('start-trip-btn'); btn.disabled = true;
  try {
    const trip = await Api.post('/driver/trips/start', {});
    state.trip = { id: trip.id, tripId: trip.id, startedAt: trip.startedAt, status: 'in_progress' };
    state.vehicle.currentStatus = 'on_trip';
    $('vehicle-status-badge').innerHTML = statusBadge('on_trip');
    renderAssignment();
    startGps();
    Toast.success('Trip started. Your location is now being shared.');
  } catch (err) { Toast.error(err.message); }
  finally { btn.disabled = false; }
}

async function endTrip() {
  const btn = $('end-trip-btn'); btn.disabled = true;
  try {
    await Api.post(`/driver/trips/${state.trip?.tripId || 'current'}/end`, {});
    stopGps();                       // FR-DRV-03: immediate termination
    state.trip = null; state.speed = null;
    state.vehicle.currentStatus = 'idle';
    $('vehicle-status-badge').innerHTML = statusBadge('idle');
    renderAssignment();
    Toast.success('Trip ended. Location sharing stopped.');
  } catch (err) { Toast.error(err.message || 'Could not end the trip.'); }
  finally { btn.disabled = false; }
}

/* ─── GPS broadcasting (FR-DRV-03) ─────────────────────────────────── */
function startGps() {
  if (state.watchId !== null) return;
  if (!navigator.geolocation) { Toast.warning('This browser does not support location sharing.'); return; }
  state.watchId = navigator.geolocation.watchPosition(onGpsPosition, (err) => {
    if (err.code === 1) Toast.error('Location permission denied. Enable location for this site in your browser settings.');
    else if (err.code === 2) Toast.warning('Location unavailable. Make sure device location services are on.');
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

function stopGps() {
  if (state.watchId !== null) { navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
  clearInterval(state.tickTimer); state.tickTimer = null;
  $('live-banner').classList.add('hidden'); $('gps-coords-wrap').classList.add('hidden');
}

async function onGpsPosition(pos) {
  const tripId = state.trip?.tripId;
  if (!tripId) { stopGps(); return; }
  const { latitude, longitude, accuracy, heading, speed } = pos.coords;
  state.speed = speed;
  $('gps-coords').textContent = `${latitude.toFixed(5)}°, ${longitude.toFixed(5)}° · accuracy ${Math.round(accuracy)} m`;
  try {
    await Api.post(`/driver/trips/${tripId}/location`, { latitude, longitude, accuracy: accuracy ?? null, heading: heading ?? null, speed: speed ?? null, timestamp: new Date().toISOString() });
  } catch (err) {
    if (err.code === 'TRIP_NOT_ACTIVE' || err.code === 'TRIP_NOT_FOUND') { stopGps(); state.trip = null; loadAssignment({ quiet: true }); }
  }
}

/* ─── Reassignment alert (FR-DRV-04) ───────────────────────────────── */
function showReassign(data) {
  $('reassign-msg').textContent = data.newDriver?.id === state.driverId
    ? 'You have been assigned to a vehicle. Your assignment below is up to date.'
    : 'Your vehicle assignment was changed by the transport authority.';
  $('reassign-alert').classList.remove('hidden');
}

/* ─── Notifications ────────────────────────────────────────────────── */
function setupBell() {
  const btn = $('bell-btn'), menu = $('bell-menu');
  const close = () => { menu.classList.add('hidden'); btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!menu.classList.contains('hidden')) { close(); return; }
    await loadNotifications(); paintMenu(); menu.classList.remove('hidden'); btn.setAttribute('aria-expanded', 'true');
  });
  document.addEventListener('click', (e) => { if (!menu.contains(e.target) && e.target !== btn) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
}

async function loadNotifications() {
  try {
    const d = await Api.get('/fleet/notifications');
    state.notes = d.items;
    const b = $('bell-badge'); b.textContent = d.unreadCount > 99 ? '99+' : d.unreadCount; b.classList.toggle('hidden', d.unreadCount === 0);
  } catch { /* keep the previous badge */ }
}

function paintMenu() {
  const menu = $('bell-menu'); menu.replaceChildren();
  const head = document.createElement('div'); head.className = 'menu-head';
  const t = document.createElement('span'); t.textContent = 'Notifications';
  const all = document.createElement('button'); all.className = 'link'; all.type = 'button'; all.textContent = 'Mark all read';
  all.onclick = async () => { await Api.post('/fleet/notifications/read-all'); await loadNotifications(); paintMenu(); };
  head.append(t, all); menu.append(head);
  if (!state.notes.length) { const e = document.createElement('div'); e.className = 'menu-item'; e.textContent = 'No notifications yet.'; menu.append(e); return; }
  state.notes.slice(0, 15).forEach((n) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = `menu-item${n.isRead ? '' : ' unread'}`;
    const d = document.createElement('div'); const s = document.createElement('strong'); s.textContent = n.title;
    const m = document.createElement('small'); m.textContent = `${n.message} · ${fmtTime(n.createdAt)}`;
    d.append(s, m); b.append(d);
    b.onclick = async () => { if (!n.isRead) { await Api.post(`/fleet/notifications/${n.id}/read`); await loadNotifications(); paintMenu(); } };
    menu.append(b);
  });
}

/* ─── UI helpers ───────────────────────────────────────────────────── */
function showState(s) {
  $('loading-state').classList.toggle('hidden', s !== 'loading');
  $('assignment-card').classList.toggle('hidden', s !== 'assignment');
  $('no-assignment').classList.toggle('hidden', s !== 'no-assignment');
}

function signOut() { stopGps(); Auth.clear(); window.location.href = '../index.html'; }
</script>
</body>
</html>
