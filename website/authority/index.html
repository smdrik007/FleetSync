<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetSync — Authority Console</title>
  <meta name="description" content="FleetSync authority console: fleet, tracking, operations and administration for your institution." />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../app.js"></script>
</head>
<body>
  <a class="sr-only" href="#view">Skip to content</a>

  <div class="app-shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="sidebar-head">
        <div class="logo-mark" aria-hidden="true">FS</div>
        <div class="sidebar-brand">Fleet<span>Sync</span></div>
      </div>
      <div class="inst-chip" id="inst-chip">
        <div class="avatar" id="inst-avatar" aria-hidden="true">·</div>
        <div><strong id="inst-name">Loading…</strong><small id="inst-slug">&nbsp;</small></div>
      </div>
      <nav class="nav" id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <button class="nav-item w-full" id="collapse-btn" type="button" style="background:none;border:none;font-family:inherit" aria-label="Collapse sidebar">
          <span id="collapse-icon"></span><span class="collapse-label">Collapse</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main-area">
      <header class="topbar">
        <button class="top-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu"></button>
        <nav class="breadcrumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-spacer"></div>
        <button class="search-trigger" id="search-btn" type="button" aria-label="Search (Ctrl+K)">
          <span id="search-icon"></span><span class="st-text">Search…</span><span class="kbd">Ctrl K</span>
        </button>
        <div class="ws-pill" id="ws-pill" role="status" aria-live="polite"><i class="dot-live off" id="ws-dot"></i><span id="ws-text">Connecting</span></div>
        <button class="top-btn" id="theme-btn" type="button" aria-label="Toggle theme"></button>
        <div style="position:relative">
          <button class="top-btn" id="bell-btn" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
            <span id="bell-icon"></span><span class="bell-badge hidden" id="bell-badge">0</span>
          </button>
          <div class="menu hidden" id="bell-menu" role="menu"></div>
        </div>
        <div style="position:relative">
          <button class="user-chip" id="user-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="avatar" id="user-avatar">?</span><span class="uname" id="user-name"></span>
          </button>
          <div class="menu menu-narrow hidden" id="user-menu" role="menu"></div>
        </div>
      </header>
      <main class="page" id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
